<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAALETSGO</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="bug">
        <div class="clock"><span id="clock">00:00</span><small id="rules">Classic rules</small></div>
        <div class="team"><span class="sw ard"></span>ARD <span class="sc" id="score-home">0-00 (0)</span></div>
        <div class="team"><span class="sw kil"></span>KIL <span class="sc" id="score-away">0-00 (0)</span></div>
      </div>
      <div class="card">
        <div class="nm"><span>14</span>C. Mac Giolla</div>
        <div class="pos">FULL-FORWARD · ARDMORE</div>
        <div class="steps" id="steps">STEPS <b></b><b></b><b></b><b></b> <em id="steps-hint"></em></div>
        <div class="power" id="power" hidden><i></i></div>
      </div>
      <div class="prompt" id="prompt" hidden></div>
      <div class="banner" id="banner" hidden><div class="t" id="banner-title"></div><div class="s" id="banner-sub"></div></div>
      <div class="help">
        <b>WASD</b> move · <b>Shift</b> sprint · <b>O</b> solo · <b>B</b> bounce · <b>J</b> hand-pass<br />
        <b>K</b> hold for a lofted kick · <b>L</b> hold for a low kick · <b>E</b> toe-pick<br />
        <b>C</b> camera · <b>R</b> classic / 2025 rules
      </div>
    </div>
    <div id="loading">Loading the pitch…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
